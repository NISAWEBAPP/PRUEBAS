    <script>
// Wait for the window to load so that 'map' is defined by qgis2web.js
window.addEventListener('load', function() {// Get reference to the new button
var centerButton = document.getElementById('center-me');

// Show/Hide the button based on the checkbox
trackCheckbox.addEventListener('change', function () {
    centerButton.style.display = this.checked ? 'block' : 'none';
});

// Handle the "Center on Me" click
centerButton.addEventListener('click', function() {
    var coordinates = geolocation.getPosition();
    if (coordinates) {
        map.getView().animate({
            center: coordinates,
            duration: 500, // Smooth transition in milliseconds
            zoom: 18       // Snappy zoom level for location
        });
    } else {
        alert("Waiting for GPS signal...");
    }
});
    if (typeof map !== 'undefined') {
        
        // 1. Setup Geolocation
        var geolocation = new ol.Geolocation({
            trackingOptions: {
                enableHighAccuracy: true,
            },
            projection: map.getView().getProjection(),
        });

        // 2. Control the tracking via checkbox
        var trackCheckbox = document.getElementById('track');
        var infoDiv = document.getElementById('location-info');
        
        trackCheckbox.addEventListener('change', function () {
            geolocation.setTracking(this.checked);
            infoDiv.style.display = this.checked ? 'block' : 'none';
            
        });

        // 3. Update UI on changes
        geolocation.on('change', function () {
            document.getElementById('accuracy').innerText = Math.round(geolocation.getAccuracy()) || 0;
            var heading = geolocation.getHeading();
            document.getElementById('heading').innerText = heading ? Math.round(heading * (180 / Math.PI)) : 0;
        });

        // 4. Handle Errors (e.g., GPS turned off)
        geolocation.on('error', function (error) {
            var info = document.getElementById('info');
            info.innerHTML = "Error: " + error.message;
            info.style.display = 'block';
        });

        // 5. Create the "Blue Dot" Features
        var accuracyFeature = new ol.Feature();
        geolocation.on('change:accuracyGeometry', function () {
            accuracyFeature.setGeometry(geolocation.getAccuracyGeometry());
        });

        var positionFeature = new ol.Feature();
        positionFeature.setStyle(
            new ol.style.Style({
                image: new ol.style.Circle({
                    radius: 7,
                    fill: new ol.style.Fill({ color: '#3399CC' }),
                    stroke: new ol.style.Stroke({ color: '#fff', width: 2 }),
                }),
            })
        );

        geolocation.on('change:position', function () {
            var coordinates = geolocation.getPosition();
            positionFeature.setGeometry(coordinates ? new ol.geom.Point(coordinates) : null);
            
            // Optional: Automatically center the map on the user when they first enable tracking
            if (trackCheckbox.checked && coordinates) {
                map.getView().setCenter(coordinates);
                // We only auto-center once to avoid annoying the user while they browse
                // map.getView().setZoom(17); 
            }
        });

        // 6. Add the geolocation layer to the map
        var geoLayer = new ol.layer.Vector({
            source: new ol.source.Vector({
                features: [accuracyFeature, positionFeature],
            }),
        });
        map.addLayer(geoLayer);
    }
});
</script>
